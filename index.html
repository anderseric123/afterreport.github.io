
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>金十期货盘后长图生成器</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card-bg: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --line: #dfe1e4;
      --panel: #ffffff;
      --gold: #c8a96a;
      --gold-soft: rgba(200, 169, 106, 0.22);
      --red: #d32f2f;
      --green: #169b62;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      padding: 18px 12px 36px;
    }

    .workspace {
      max-width: 1060px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid #e3e5e8;
      border-radius: 12px;
      padding: 14px;
    }

    .panel h1 {
      font-size: 18px;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .panel-tip {
      color: #5f6368;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .json-input {
      width: 100%;
      min-height: 300px;
      border: 1px solid #d7dbe0;
      border-radius: 10px;
      padding: 10px;
      font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
      color: #202124;
      background: #fcfcfd;
      resize: vertical;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
      align-items: center;
    }

    .btn {
      border: 1px solid #d1d5da;
      background: #fff;
      color: #1f2328;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn:hover {
      background: #f3f4f6;
    }

    .btn-primary {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }

    .btn-primary:hover {
      background: #1f2937;
    }

    .status {
      font-size: 12px;
      color: #4b5563;
      margin-top: 8px;
      min-height: 18px;
    }

    .asset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
      align-items: center;
    }

    .asset-row label {
      font-size: 12px;
      color: #4b5563;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cards-wrap {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(410px, 1fr));
      gap: 16px;
      align-items: start;
    }

    .preview-block {
      background: #fff;
      border: 1px solid #e4e6ea;
      border-radius: 12px;
      padding: 12px;
    }

    .preview-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .preview-head h2 {
      font-size: 14px;
      line-height: 1.3;
      color: #1f2937;
    }

    .preview-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .size-tip {
      font-size: 11px;
      color: #6b7280;
    }

    .phone-stage {
      display: flex;
      justify-content: center;
      overflow: auto;
      background: #f2f4f7;
      border-radius: 10px;
      padding: 10px;
    }

    .report-card {
      width: 393px;
      background: #fff;
      border: 1px solid #e6e7ea;
      border-radius: 0;
      padding: 16px 14px 18px;
      position: relative;
      overflow: hidden;
    }

    .watermark-layer {
      position: absolute;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      width: 210px;
      opacity: 0.65;
      pointer-events: none;
      z-index: 30;
    }

    .watermark-layer img {
      width: 100%;
      height: auto;
      display: block;
    }

    .top-brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-box {
      width: 98px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
      border-radius: 0;
      flex: 0 0 auto;
    }

    .logo-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    .publish-time {
      font-size: 10px;
      line-height: 1.2;
      color: #8a8a8a;
      font-weight: 500;
      text-align: right;
    }

    .title-block {
      margin-bottom: 8px;
    }

    .title-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .main-title {
      font-size: 20px;
      line-height: 1.2;
      font-weight: 900;
      color: var(--red);
      letter-spacing: 0.2px;
      margin-bottom: 6px;
      flex: 1;
      min-width: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .main-title.title-up {
      color: var(--red);
    }

    .main-title.title-down {
      color: var(--green);
    }

    .summary {
      font-size: 14px;
      line-height: 1.45;
      color: #4f545b;
      display: block;
      white-space: normal;
      overflow: visible;
    }

    .module {
      margin-bottom: 18px;
    }

    .module-title {
      font-size: 16px;
      line-height: 1.2;
      font-weight: 820;
      color: #2a2a2a;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .module-title::before {
      content: "";
      width: 4px;
      height: 16px;
      border-radius: 3px;
      background: linear-gradient(180deg, #d6b676 0%, #c6a05a 100%);
      flex: 0 0 auto;
    }

    .radar-wrap {
      background: #f7f7f5;
      border: 1px solid #e7e7e7;
      border-radius: 10px;
      padding: 8px;
    }

    .radar-svg {
      width: 100%;
      height: 210px;
      display: block;
    }

    .radar-notes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 10px;
      margin-top: 4px;
    }

    .radar-note {
      font-size: 12px;
      line-height: 1.25;
      color: #373737;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .radar-note::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      margin-top: 4px;
      flex: 0 0 auto;
    }

    .radar-note-inline {
      font-size: 11px;
      fill: #6b7280;
      font-weight: 500;
    }

    .chain {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chain-card {
      background: #f8f8f8;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 6px 8px;
    }

    .chain-card p {
      font-size: 13px;
      line-height: 1.3;
      color: #30363b;
    }

    .chain-key {
      color: #af8845;
      font-weight: 820;
    }

    .arrow-down {
      text-align: center;
      font-size: 16px;
      line-height: 1;
      color: #b9965b;
      font-weight: 800;
    }

    .risk-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .risk-card {
      background: #fbfbfb;
      border: 1px solid #e6e6e6;
      border-radius: 10px;
      padding: 6px 8px;
    }

    .risk-head {
      font-size: 14px;
      font-weight: 820;
      color: var(--green);
      line-height: 1.25;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
    }

    .risk-title-text {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      flex: 1;
    }

    .risk-head::before {
      content: "";
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 10px solid var(--green);
      transform: rotate(180deg);
      flex: 0 0 auto;
    }

    .risk-card.risk-color-red .risk-head {
      color: var(--red);
    }

    .risk-card.risk-color-red .risk-head::before {
      border-bottom-color: var(--red);
    }

    .risk-card.risk-color-green .risk-head {
      color: var(--green);
    }

    .risk-card.risk-color-green .risk-head::before {
      border-bottom-color: var(--green);
    }

    .risk-card.risk-arrow-up .risk-head::before {
      transform: rotate(0deg);
    }

    .risk-card.risk-arrow-down .risk-head::before {
      transform: rotate(180deg);
    }

    .risk-manual-controls {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
    }

    .risk-manual-controls label {
      font-size: 10px;
      color: #6b7280;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .risk-style-select {
      font-size: 10px;
      line-height: 1.2;
      border: 1px solid #d4d8de;
      border-radius: 6px;
      background: #fff;
      color: #374151;
      padding: 1px 4px;
    }

    .report-card.export-mode .risk-manual-controls {
      display: none !important;
    }

    .title-manual-controls {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
      margin-top: 2px;
    }

    .title-manual-controls label {
      font-size: 10px;
      color: #6b7280;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .title-style-select {
      font-size: 10px;
      line-height: 1.2;
      border: 1px solid #d4d8de;
      border-radius: 6px;
      background: #fff;
      color: #374151;
      padding: 1px 4px;
    }

    .report-card.export-mode .title-manual-controls {
      display: none !important;
    }

    .risk-card p {
      font-size: 13px;
      line-height: 1.3;
      color: #3d4349;
    }

    .one-line-box {
      background: linear-gradient(180deg, #f8f3e7 0%, #f7f1e0 100%);
      border: 1px solid #e7dbbe;
      border-radius: 10px;
      padding: 7px 8px;
      font-size: 13px;
      line-height: 1.33;
      color: #5e4a26;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .footer {
      margin-top: 10px;
      border-top: 1px solid #dddddd;
      padding-top: 8px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .foot-left {
      flex: 1;
      min-width: 0;
    }

    .foot-left p {
      font-size: 11px;
      line-height: 1.35;
      color: #727272;
      word-break: break-word;
    }

    .foot-right {
      width: 114px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
      flex: 0 0 auto;
    }

    .qr-box {
      width: 88px;
      height: 88px;
      border-radius: 6px;
      border: 1px solid #cfcfcf;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .qr-text {
      font-size: 11px;
      color: #333;
      text-align: center;
      line-height: 1.25;
      font-weight: 700;
    }

    .small {
      font-size: 11px;
      color: #6b7280;
      line-height: 1.4;
    }

    @media (max-width: 860px) {
      .cards-wrap {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 460px) {
      .preview-block {
        padding: 10px;
      }

      .phone-stage {
        padding: 6px;
      }

      .report-card {
        width: 100%;
        max-width: 393px;
      }
    }
  </style>
</head>
<body>
  <div class="workspace">
    <section class="panel">
      <h1>盘后长图 JSON 生成区（固定格式）</h1>
      <p class="panel-tip">每次只需要粘贴同格式 JSON，点击“应用 JSON”即可自动生成 6 张示例图。每张图 radar 会按你提供的维度名和数值动态绘制（支持 3-8 维，含 6 维）。下载会自动压缩为接近 900KB 的 JPG 长图。</p>
      <textarea id="jsonInput" class="json-input" spellcheck="false"></textarea>

      <div class="toolbar">
        <button class="btn btn-primary" id="applyBtn">应用 JSON</button>
        <button class="btn" id="resetBtn">载入示例 JSON</button>
        <button class="btn" id="downloadAllBtn">下载全部（图1-图6）</button>
      </div>
      <p class="small">Logo 和二维码已写死在模板中，无需上传文件。</p>
      <div id="status" class="status"></div>
    </section>

    <section class="cards-wrap" id="cardsWrap"></section>
  </div>

    const state = {
      payload: structuredClone(DEFAULT_PAYLOAD),
      logoSrc: LOGO_DEFAULT,
      qrSrc: QR_DEFAULT,
      watermarkSrc: WATERMARK_DEFAULT,
      manualRiskOverrides: {},
      manualTitleOverrides: {}
    };

    function escapeHTML(input) {
      const str = String(input ?? "");
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function pointForRadar(index, total, radius, cx, cy) {
      const angle = -Math.PI / 2 + (index * Math.PI * 2) / total;
      return {
        x: cx + Math.cos(angle) * radius,
        y: cy + Math.sin(angle) * radius
      };
    }

    function buildPolygonPoints(values, total, maxR, cx, cy) {
      return values
        .map((ratio, i) => {
          const p = pointForRadar(i, total, maxR * ratio, cx, cy);
          return `${p.x.toFixed(1)},${p.y.toFixed(1)}`;
        })
        .join(" ");
    }

    function buildRadarNoteMap(dimNames, radarNotes) {
      const map = new Map();
      const dimSet = new Set(dimNames);
      const plain = [];
      (Array.isArray(radarNotes) ? radarNotes : []).forEach((raw) => {
        const note = String(raw || "").trim();
        if (!note) return;
        const parts = note.split("：");
        if (parts.length >= 2) {
          const key = parts[0].trim();
          const value = parts.slice(1).join("：").trim();
          if (dimSet.has(key) && value) {
            map.set(key, value);
            return;
          }
        }
        plain.push(note);
      });

      dimNames.forEach((name, idx) => {
        if (!map.has(name) && plain[idx]) {
          map.set(name, plain[idx].replace(/^.*?：/, ""));
        }
      });
      return map;
    }

    function buildRadarSVG(radarEntries, radarNotes) {
      const baseEntries = Array.isArray(radarEntries) ? radarEntries.slice(0, RADAR_MAX_DIM) : [];
      const dimCount = Math.max(RADAR_MIN_DIM, baseEntries.length);
      const entries = [...baseEntries];
      while (entries.length < dimCount) {
        entries.push([`维度${entries.length + 1}`, 0]);
      }
      const values = entries.map((entry) => Number(entry?.[1]) || 0);
      const dimNames = entries.map((entry) => String(entry?.[0] || ""));
      const noteMap = buildRadarNoteMap(dimNames, radarNotes);
      const ratios = values.map((v) => v / 100);
      const cx = 160;
      const cy = 132;
      const maxR = 64;

      let rings = "";
      for (let step = 5; step >= 1; step -= 1) {
        const ratio = step / 5;
        const points = buildPolygonPoints(new Array(dimCount).fill(ratio), dimCount, maxR, cx, cy);
        const stroke = step === 5 ? "#dedede" : "#ececec";
        const strokeWidth = step === 5 ? 1.8 : 1.2;
        rings += `<polygon points="${points}" fill="none" stroke="${stroke}" stroke-width="${strokeWidth}"/>`;
      }

      const axes = new Array(dimCount)
        .fill(0)
        .map((_, i) => {
          const p = pointForRadar(i, dimCount, maxR, cx, cy);
          return `<line x1="${cx}" y1="${cy}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="#dddddd" stroke-width="1"/>`;
        })
        .join("");

      const dataPoints = buildPolygonPoints(ratios, dimCount, maxR, cx, cy);

      const labels = dimNames.map((name, i) => {
        const p = pointForRadar(i, dimCount, maxR + 30, cx, cy);
        let anchor = "middle";
        const angle = -Math.PI / 2 + (i * Math.PI * 2) / dimCount;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        if (cos > 0.28) anchor = "start";
        if (cos < -0.28) anchor = "end";
        const labelFont = dimCount >= 7 ? 13 : 15;
        const note = String(noteMap.get(name) || "");
        const safeNote = escapeHTML(note.length > 14 ? `${note.slice(0, 14)}…` : note);

        // 解释文字默认放在小标题下方；顶部维度若空间紧，则放在右侧。
        let noteX = p.x;
        let noteY = p.y + 18;
        let noteAnchor = anchor;
        if (sin < -0.85) {
          noteX = p.x + 54;
          noteY = p.y + 2;
          noteAnchor = "start";
        } else if (sin > 0.55) {
          // 底部区域说明文字：向左偏移并下移，避免与小标题过近
          noteX = p.x - 14;
          noteY = p.y + 24;
          if (cos > 0.35) {
            noteAnchor = "start";
          } else if (cos < -0.35) {
            noteAnchor = "end";
          } else {
            noteAnchor = "middle";
          }
        } else if (cos > 0.6) {
          noteX = p.x - 10;
          noteY = p.y + 20;
          noteAnchor = "start";
        } else if (cos < -0.6) {
          noteX = p.x - 8;
          noteY = p.y + 20;
          noteAnchor = "end";
        } else {
          noteAnchor = "middle";
        }

        const noteText = note
          ? `<text class="radar-note-inline" x="${noteX.toFixed(1)}" y="${noteY.toFixed(1)}" text-anchor="${noteAnchor}">${safeNote}</text>`
          : "";
        return `<text x="${p.x.toFixed(1)}" y="${(p.y + 4).toFixed(1)}" text-anchor="${anchor}" font-size="${labelFont}" fill="#111" font-weight="700">${escapeHTML(name)}</text>${noteText}`;
      }).join("");

      const valueLabels = values.map((v, i) => {
        const p = pointForRadar(i, dimCount, maxR + 10, cx, cy);
        return `<text x="${p.x.toFixed(1)}" y="${(p.y + 4).toFixed(1)}" text-anchor="middle" font-size="12" fill="#9a7a3f" font-weight="700">${v}</text>`;
      }).join("");

      return `
        <svg class="radar-svg" viewBox="0 0 320 268" xmlns="http://www.w3.org/2000/svg" aria-label="${dimCount}维雷达图">
          ${rings}
          ${axes}
          <polygon points="${dataPoints}" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2.2"/>
          ${valueLabels}
          ${labels}
        </svg>
      `;
    }

    function normalizeRadar(rawRadar) {
      const entries = Object.entries(rawRadar || {})
        .map(([name, value]) => [String(name || "").trim(), Number(value)])
        .filter(([name, value]) => name.length > 0 && Number.isFinite(value))
        .slice(0, RADAR_MAX_DIM)
        .map(([name, value]) => [name, clamp(value, 0, 100)]);
      return entries;
    }

    function normalizeReport(input) {
      const report = input || {};
      return {
        title: report.title || "",
        summary: report.summary || "",
        radar: normalizeRadar(report.radar || {}),
        radarNotes: Array.isArray(report.radarNotes)
          ? report.radarNotes
              .filter((item) => !String(item || "").includes("综合强度"))
              .slice(0, 6)
          : [],
        chain: Array.isArray(report.chain) ? report.chain.slice(0, 6) : [],
        risks: Array.isArray(report.risks) ? report.risks.slice(0, 4) : [],
        oneLine: report.oneLine || "",
        source: report.source || "",
        disclaimer: report.disclaimer || ""
      };
    }

    function inferRiskTone(riskItem) {
      const text = `${riskItem?.title || ""} ${riskItem?.text || ""}`;

      if (text.includes("旺季") && text.includes("下行空间")) return "risk-up";
      // 先处理强规则（命中即返回）
      if (/限制.{0,8}下行空间/.test(text)) return "risk-up";
      if (/下行空间.{0,8}受限/.test(text)) return "risk-up";
      if (/支撑油价|对油价形成支撑|提振油价/.test(text)) return "risk-up";
      if (/压制油价|油价承压|油价回落|下跌压力/.test(text)) return "risk-down";

      // 再做打分，避免“红绿词同时出现”时误判
      const upKeywords = [
        "上涨", "上行", "走强", "抬升", "升温", "紧张", "收紧",
        "供应受限", "供应收缩", "封锁", "中断", "溢价扩大", "扰动升级",
        "旺季", "支撑", "提振", "去库", "去化", "偏紧", "回升"
      ];
      const downKeywords = [
        "下跌", "回落", "走弱", "回调", "降温", "缓解", "宽松",
        "恢复", "通航改善", "溢价回落", "需求不及预期", "传导失败", "开工放缓",
        "压制", "承压", "回流", "放缓", "需求偏弱", "走低", "下行", "强美元"
      ];

      let upScore = 0;
      let downScore = 0;

      upKeywords.forEach((kw) => {
        if (text.includes(kw)) upScore += 1;
      });
      downKeywords.forEach((kw) => {
        if (text.includes(kw)) downScore += 1;
      });

      if (upScore > downScore) return "risk-up";
      return "risk-down";
    }

    function inferRiskStyle(riskItem) {
      const tone = inferRiskTone(riskItem);
      if (tone === "risk-up") {
        return { color: "red", arrow: "up" };
      }
      return { color: "green", arrow: "down" };
    }

    function getRiskOverride(cardIndex, riskIndex) {
      return state.manualRiskOverrides?.[cardIndex]?.[riskIndex] || { color: "auto", arrow: "auto" };
    }

    function getTitleOverride(cardIndex) {
      return state.manualTitleOverrides?.[cardIndex] || "auto";
    }

    function inferToneByText(text) {
      const upWords = [
        "上涨", "上行", "走强", "抬升", "反弹", "修复", "偏强", "新高", "拉升", "领涨", "涨停", "收涨", "回升"
      ];
      const downWords = [
        "下跌", "下行", "走弱", "回落", "回调", "重心回落", "下挫", "承压", "回吐", "破位", "收跌", "跳空下跌", "跳空下挫"
      ];

      let upScore = 0;
      let downScore = 0;
      upWords.forEach((w) => { if (text.includes(w)) upScore += 1; });
      downWords.forEach((w) => { if (text.includes(w)) downScore += 1; });

      if (downScore > upScore) return "title-down";
      return "title-up";
    }

    function inferTitleTone(report) {
      const chain = Array.isArray(report?.chain) ? report.chain : [];
      const reaction = chain.find((item) => String(item?.label || "").includes("盘面反应"));

      // 优先按“盘面反应”决定标题颜色：上涨=红，下跌=绿
      if (reaction && reaction.text) {
        return inferToneByText(String(reaction.text));
      }

      // 回退：用标题+摘要判定
      const fallbackText = `${report?.title || ""} ${report?.summary || ""}`;
      return inferToneByText(fallbackText);
    }

    function renderCardHTML(report, publishTime, cardIndex) {
      const chainHTML = report.chain
        .map((item, idx) => {
          const card = `<article class="chain-card"><p><span class="chain-key">${escapeHTML(item.label)}：</span>${escapeHTML(item.text)}</p></article>`;
          if (idx === report.chain.length - 1) return card;
          return `${card}<div class="arrow-down">↓</div>`;
        })
        .join("");

      const risksHTML = report.risks
        .map((item, riskIndex) => {
          const autoStyle = inferRiskStyle(item);
          const override = getRiskOverride(cardIndex, riskIndex);
          const finalColor = override.color && override.color !== "auto" ? override.color : autoStyle.color;
          const finalArrow = override.arrow && override.arrow !== "auto" ? override.arrow : autoStyle.arrow;

          return `<article class="risk-card risk-color-${finalColor} risk-arrow-${finalArrow}">
            <div class="risk-head">
              <span class="risk-title-text">${escapeHTML(item.title)}</span>
              <span class="risk-manual-controls">
                <label>色
                  <select class="risk-style-select" data-card-index="${cardIndex}" data-risk-index="${riskIndex}" data-kind="color">
                    <option value="auto" ${override.color === "auto" ? "selected" : ""}>自动</option>
                    <option value="red" ${override.color === "red" ? "selected" : ""}>红</option>
                    <option value="green" ${override.color === "green" ? "selected" : ""}>绿</option>
                  </select>
                </label>
                <label>箭
                  <select class="risk-style-select" data-card-index="${cardIndex}" data-risk-index="${riskIndex}" data-kind="arrow">
                    <option value="auto" ${override.arrow === "auto" ? "selected" : ""}>自动</option>
                    <option value="up" ${override.arrow === "up" ? "selected" : ""}>上</option>
                    <option value="down" ${override.arrow === "down" ? "selected" : ""}>下</option>
                  </select>
                </label>
              </span>
            </div>
            <p>${escapeHTML(item.text)}</p>
          </article>`;
        })
        .join("");
      const radarDimText = `${report.radar.length}维`;
      const autoTitleToneClass = inferTitleTone(report);
      const titleOverride = getTitleOverride(cardIndex);
      const titleToneClass = titleOverride === "red"
        ? "title-up"
        : titleOverride === "green"
          ? "title-down"
          : autoTitleToneClass;
      const titleSelectValue = titleToneClass === "title-down" ? "green" : "red";

      return `
        <div class="watermark-layer"><img src="${escapeHTML(state.watermarkSrc)}" alt="金十期货水印"/></div>

        <header class="top-brand">
          <div class="brand-left">
            <div class="logo-box"><img src="${escapeHTML(state.logoSrc)}" alt="金十期货Logo"/></div>
          </div>
          <div class="publish-time">发布时间：${escapeHTML(publishTime)}</div>
        </header>

        <section class="title-block">
          <div class="title-head">
            <h1 class="main-title ${titleToneClass}">${escapeHTML(report.title)}</h1>
            <span class="title-manual-controls">
              <label>色
                <select class="title-style-select" data-card-index="${cardIndex}" data-kind="title-color">
                  <option value="red" ${titleSelectValue === "red" ? "selected" : ""}>红</option>
                  <option value="green" ${titleSelectValue === "green" ? "selected" : ""}>绿</option>
                </select>
              </label>
            </span>
          </div>
          <p class="summary">${escapeHTML(report.summary)}</p>
        </section>

        <section class="module">
          <h2 class="module-title">今日${radarDimText}驱动雷达</h2>
          <div class="radar-wrap">
            ${buildRadarSVG(report.radar, report.radarNotes)}
          </div>
        </section>

        <section class="module">
          <h2 class="module-title">基本面传导链</h2>
          <div class="chain">${chainHTML}</div>
        </section>

        <section class="module">
          <h2 class="module-title">风险拆解</h2>
          <div class="risk-list">${risksHTML}</div>
        </section>

        <footer class="footer">
          <div class="foot-left">
            <p>${escapeHTML(report.source)}</p>
            <p>${escapeHTML(report.disclaimer)}</p>
          </div>
          <div class="foot-right">
            <div class="qr-box"><img src="${escapeHTML(state.qrSrc)}" alt="下载金十期货APP二维码"/></div>
            <div class="qr-text">下载金十期货APP</div>
          </div>
        </footer>
      `;
    }

    function buildPreviewShell(index) {
      return `
        <article class="preview-block" data-index="${index}">
          <div class="preview-head">
            <h2>示例图 ${index + 1}</h2>

              <button class="btn" data-download="${index}">下载长图</button>

            <div class="report-card" id="reportCard${index}"></div>
          </div>
        </article>
      `;
    }

    function renderPreviews(payload) {
      const wrap = document.getElementById("cardsWrap");
      if (!wrap.childElementCount) {
        wrap.innerHTML = new Array(CARD_COUNT).fill(0).map((_, i) => buildPreviewShell(i)).join("");
      }

      const publishTime = payload.publishTime || "";
      const reports = Array.isArray(payload.reports) ? payload.reports : [];

      for (let i = 0; i < CARD_COUNT; i += 1) {
        const fallback = reports[reports.length - 1] || DEFAULT_PAYLOAD.reports[0];
        const report = normalizeReport(reports[i] || fallback);
        const card = document.getElementById(`reportCard${i}`);
        card.innerHTML = renderCardHTML(report, publishTime, i);
      }
    }

    function setStatus(text, isError = false) {
      const status = document.getElementById("status");
      status.textContent = text;
      status.style.color = isError ? "#b91c1c" : "#4b5563";
    }

    function loadDefaultJSON() {
      const input = document.getElementById("jsonInput");
      input.value = JSON.stringify(DEFAULT_PAYLOAD, null, 2);
      state.payload = structuredClone(DEFAULT_PAYLOAD);
      state.manualRiskOverrides = {};
      state.manualTitleOverrides = {};
      renderPreviews(state.payload);
      setStatus("已载入示例 JSON，可直接修改后点击应用。", false);
    }

    async function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function ensureHtml2Canvas() {
      if (window.html2canvas) return window.html2canvas;

      await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
        script.async = true;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });

      if (!window.html2canvas) {
        throw new Error("html2canvas 加载失败");
      }
      return window.html2canvas;
    }

    async function inlineImagesForExport(cloneRoot) {
      const imgs = Array.from(cloneRoot.querySelectorAll("img"));
      for (const img of imgs) {
        const src = img.getAttribute("src") || "";
        if (src.startsWith("data:")) continue;
        try {
          const response = await fetch(src);
          const blob = await response.blob();
          const dataURL = await fileToDataURL(blob);
          img.setAttribute("src", dataURL);
        } catch (e) {
          // 保留原 src，导出时如果触发安全限制会在上层提示
        }
      }
    }

    function canvasToBlob(canvas, type, quality) {
      return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(blob), type, quality);
      });
    }

    async function renderNodeToCanvas(node, scale = 3) {
      // 优先使用 html2canvas，兼容 Safari/WebKit 的 foreignObject 安全限制。
      try {
        const html2canvas = await ensureHtml2Canvas();
        const canvas = await html2canvas(node, {
          backgroundColor: "#ffffff",
          scale,
          useCORS: true,
          allowTaint: true,
          logging: false
        });
        if (canvas && canvas.width > 0 && canvas.height > 0) {
          return canvas;
        }
      } catch (error) {
        // 自动回退到原有 SVG + foreignObject 方案。
      }

      const width = Math.ceil(node.offsetWidth);
      const height = Math.ceil(node.scrollHeight);
      const clone = node.cloneNode(true);
      await inlineImagesForExport(clone);

      const cssText = Array.from(document.querySelectorAll("style"))
        .map((style) => style.textContent)
        .join("\n");

      const html = clone.outerHTML;
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
          <style><![CDATA[${cssText}]]></style>
          <foreignObject x="0" y="0" width="100%" height="100%">
            <div xmlns="http://www.w3.org/1999/xhtml" style="width:${width}px;height:${height}px;">${html}</div>
          </foreignObject>
        </svg>
      `;

      const svgBlob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
      const svgUrl = URL.createObjectURL(svgBlob);

      try {
        const img = await new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = reject;
          image.src = svgUrl;
        });

        const canvas = document.createElement("canvas");
        canvas.width = Math.ceil(width * scale);
        canvas.height = Math.ceil(height * scale);
        const ctx = canvas.getContext("2d");
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
        ctx.drawImage(img, 0, 0, width, height);
        return canvas;
      } finally {
        URL.revokeObjectURL(svgUrl);
      }
    }

    async function compressCanvasToTarget(canvas, targetBytes) {
      const scaleSteps = [1, 0.92, 0.86, 0.8, 0.74];

      for (const step of scaleSteps) {
        let workCanvas = canvas;
        if (step !== 1) {
          workCanvas = document.createElement("canvas");
          workCanvas.width = Math.ceil(canvas.width * step);
          workCanvas.height = Math.ceil(canvas.height * step);
          const wctx = workCanvas.getContext("2d");
          wctx.drawImage(canvas, 0, 0, workCanvas.width, workCanvas.height);
        }

        let lo = 0.35;
        let hi = 0.95;
        let best = await canvasToBlob(workCanvas, "image/jpeg", hi);

        for (let i = 0; i < 8; i += 1) {
          const mid = (lo + hi) / 2;
          const blob = await canvasToBlob(workCanvas, "image/jpeg", mid);
          if (!blob) continue;
          if (blob.size > targetBytes) {
            hi = mid;
          } else {
            lo = mid;
            best = blob;
          }
        }

        if (best && best.size <= targetBytes * 1.08) {
          return best;
        }

        if (best && best.size < targetBytes) {
          return best;
        }
      }

      return canvasToBlob(canvas, "image/jpeg", 0.45);
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function downloadCard(index) {
      const card = document.getElementById(`reportCard${index}`);
      if (!card) return;

      setStatus(`正在生成图 ${index + 1}...`);
      try {
        card.classList.add("export-mode");
        const canvas = await renderNodeToCanvas(card, 3);
        const blob = await compressCanvasToTarget(canvas, TARGET_BYTES);
        if (!blob) {
          setStatus(`图 ${index + 1} 导出失败，请重试。`, true);
          card.classList.remove("export-mode");
          return;
        }

        const sizeKB = Math.round(blob.size / 1024);
        const filename = `盘后复盘_图${index + 1}_${Date.now()}.jpg`;
        downloadBlob(blob, filename);
        setStatus(`图 ${index + 1} 下载完成，文件约 ${sizeKB}KB。`);
      } catch (error) {
        setStatus(`图 ${index + 1} 导出失败：${error.message || "浏览器限制"}。请刷新页面后重试。`, true);
      } finally {
        card.classList.remove("export-mode");
      }
    }

    function parseJSONAndRender() {
      const input = document.getElementById("jsonInput");
      let parsed;
      try {
        parsed = parsePayloadText(input.value);
      } catch (error) {
        setStatus(`JSON 解析失败：${error.message}`, true);
        return;
      }

      if (!parsed || !Array.isArray(parsed.reports) || parsed.reports.length === 0) {
        setStatus("JSON 格式不正确：reports 必须是非空数组。", true);
        return;
      }

      const reportCount = parsed.reports.length;

      for (let i = 0; i < Math.min(parsed.reports.length, CARD_COUNT); i += 1) {
        const radar = parsed.reports[i]?.radar;
        if (!radar || typeof radar !== "object" || Array.isArray(radar)) {
          setStatus(`JSON 校验失败：示例图 ${i + 1} 的 radar 必须是对象。`, true);
          return;
        }

        const validEntries = Object.entries(radar)
          .map(([name, value]) => [String(name || "").trim(), Number(value)])
          .filter(([name, value]) => name.length > 0 && Number.isFinite(value));

        if (validEntries.length < RADAR_MIN_DIM || validEntries.length > RADAR_MAX_DIM) {
          setStatus(`JSON 校验失败：示例图 ${i + 1} 的 radar 需提供 ${RADAR_MIN_DIM}-${RADAR_MAX_DIM} 个“维度名:数值(0-100)”。`, true);
          return;
        }
      }

      state.payload = parsed;
      state.manualRiskOverrides = {};
      state.manualTitleOverrides = {};
      renderPreviews(state.payload);
      if (reportCount < CARD_COUNT) {
        setStatus(`已应用 JSON（当前 ${reportCount} 个品种）。未提供的示例位将临时复用最后一条内容。`);
      } else {
        setStatus(`已应用 JSON。驱动雷达已按实际维度和数值实时重绘。`);
      }
    }

    function parsePayloadText(rawText) {
      const text = String(rawText || "").trim();
      if (!text) {
        throw new Error("输入为空");
      }

      // 支持直接粘贴 markdown 代码块
      const normalized = text
        .replace(/^```json\s*/i, "")
        .replace(/^```\s*/i, "")
        .replace(/\s*```$/, "")
        .trim();

      // 先尝试单个 JSON
      try {
        return JSON.parse(normalized);
      } catch (_) {
        // 继续尝试“多个 JSON 对象拼接”场景
      }

      const blocks = splitTopLevelJsonObjects(normalized);
      if (!blocks.length) {
        throw new Error("未识别到有效 JSON 对象");
      }

      const merged = {
        publishTime: "",
        reports: []
      };

      blocks.forEach((block, idx) => {
        let obj;
        try {
          obj = JSON.parse(block);
        } catch (e) {
          throw new Error(`第 ${idx + 1} 段 JSON 无法解析：${e.message}`);
        }

        if (obj && typeof obj === "object" && !Array.isArray(obj)) {
          if (!merged.publishTime && obj.publishTime) merged.publishTime = obj.publishTime;
          if (Array.isArray(obj.reports)) merged.reports.push(...obj.reports);
        }
      });

      if (!merged.reports.length) {
        throw new Error("已识别多个 JSON，但均未包含 reports 数组");
      }

      return merged;
    }

    function splitTopLevelJsonObjects(text) {
      const blocks = [];
      let depth = 0;
      let start = -1;
      let inString = false;
      let escaping = false;

      for (let i = 0; i < text.length; i += 1) {
        const ch = text[i];

        if (inString) {
          if (escaping) {
            escaping = false;
          } else if (ch === "\\\\") {
            escaping = true;
          } else if (ch === "\"") {
            inString = false;
          }
          continue;
        }

        if (ch === "\"") {
          inString = true;
          continue;
        }

        if (ch === "{") {
          if (depth === 0) start = i;
          depth += 1;
          continue;
        }

        if (ch === "}") {
          depth -= 1;
          if (depth === 0 && start >= 0) {
            blocks.push(text.slice(start, i + 1));
            start = -1;
          }
          if (depth < 0) {
            throw new Error("括号层级异常，请检查 JSON 格式");
          }
        }
      }

      if (depth !== 0 || inString) {
        throw new Error("JSON 结构不完整，请检查是否缺少括号或引号");
      }

      return blocks;
    }

    function bindEvents() {
      document.getElementById("applyBtn").addEventListener("click", parseJSONAndRender);
      document.getElementById("resetBtn").addEventListener("click", loadDefaultJSON);

      document.getElementById("downloadAllBtn").addEventListener("click", async () => {
        for (let i = 0; i < CARD_COUNT; i += 1) {
          await downloadCard(i);
        }
      });

      document.getElementById("cardsWrap").addEventListener("click", async (event) => {
        const btn = event.target.closest("button[data-download]");
        if (!btn) return;
        const index = Number(btn.getAttribute("data-download"));
        if (Number.isNaN(index)) return;
        await downloadCard(index);
      });

      document.getElementById("cardsWrap").addEventListener("change", (event) => {
        const titleSelect = event.target.closest(".title-style-select");
        if (titleSelect) {
          const cardIndex = Number(titleSelect.getAttribute("data-card-index"));
          const kind = titleSelect.getAttribute("data-kind");
          const value = titleSelect.value;
          if (Number.isNaN(cardIndex)) return;
          if (kind !== "title-color") return;
          if (!["red", "green"].includes(value)) return;
          state.manualTitleOverrides[cardIndex] = value;
          renderPreviews(state.payload);
          return;
        }

        const select = event.target.closest(".risk-style-select");
        if (!select) return;

        const cardIndex = Number(select.getAttribute("data-card-index"));
        const riskIndex = Number(select.getAttribute("data-risk-index"));
        const kind = select.getAttribute("data-kind");
        const value = select.value;
        if (Number.isNaN(cardIndex) || Number.isNaN(riskIndex)) return;
        if (!["color", "arrow"].includes(kind)) return;

        if (!state.manualRiskOverrides[cardIndex]) state.manualRiskOverrides[cardIndex] = {};
        if (!state.manualRiskOverrides[cardIndex][riskIndex]) {
          state.manualRiskOverrides[cardIndex][riskIndex] = { color: "auto", arrow: "auto" };
        }
        state.manualRiskOverrides[cardIndex][riskIndex][kind] = value;
        renderPreviews(state.payload);
      });
    }

    function init() {
      bindEvents();
      loadDefaultJSON();
    }

    init();
  </script>
</body>
</html>
